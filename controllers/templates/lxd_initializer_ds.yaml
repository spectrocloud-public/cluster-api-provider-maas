apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: lxd-initializer
  labels:
    app: lxd-initializer
spec:
  selector:
    matchLabels:
      app: lxd-initializer
  template:
    metadata:
      labels:
        app: lxd-initializer
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
      - key: node.kubernetes.io/disk-pressure
        operator: "Exists"
        effect: "NoSchedule"
      - key: node.kubernetes.io/memory-pressure
        operator: "Exists"
        effect: "NoSchedule"
      - key: node-role.kubernetes.io/control-plane
        operator: "Exists"
        effect: "NoSchedule"
      initContainers:
      - name: ensure-lxd
        # Init container image only needs bash + nsenter; unrelated to the host OS.
        # Using custom registry to avoid Docker Hub rate limits
        image: us-docker.pkg.dev/palette-images/third-party/ubuntu:22.04
        imagePullPolicy: IfNotPresent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: LOCK_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: AUTO_REFRESH
          value: "${AUTO_REFRESH}"
        - name: LXD_TARGET_VERSION
          value: "${LXD_TARGET_VERSION}"
        - name: LXD_TARGET_REVISIONS
          value: "${LXD_TARGET_REVISIONS}"
        - name: LXD_RECOMMENDED_VERSION
          value: "${LXD_RECOMMENDED_VERSION}"
        - name: LOCK_NAME
          value: "lxd-initializer"
        - name: LOCK_TTL_SECONDS
          value: "600"
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          # LXD 5.0 is the series verified against our MAAS servers. Never hardcode a
          # revision: snap revisions are per-architecture, so a single number is not
          # installable everywhere (PCP-7159 reports the old pin, 38113, as unavailable
          # on amd64). The controller passes "arch=revision" pairs for the target.
          # A host older than LXD_TARGET_VERSION is refreshed to it: by its known
          # revision for this architecture, or by the channel when the channel offers
          # exactly that version. "latest" takes what the channel offers when that is
          # at least LXD_RECOMMENDED_VERSION. A host is never downgraded.
          LXD_CHANNEL=5.0/stable
          LXD_TARGET_VERSION="${LXD_TARGET_VERSION:-5.0.10}"
          LXD_TARGET_REVISIONS="${LXD_TARGET_REVISIONS:-}"
          LXD_RECOMMENDED_VERSION="${LXD_RECOMMENDED_VERSION:-5.0.10}"
          AUTO_REFRESH="${AUTO_REFRESH:-false}"
          if [[ "${LXD_TARGET_VERSION}" == latest ]]; then
            REFRESH_BELOW="${LXD_RECOMMENDED_VERSION}"
          else
            REFRESH_BELOW="${LXD_TARGET_VERSION}"
          fi
          ARCH="$(dpkg --print-architecture)"
          LOCK_TTL_SECONDS="${LOCK_TTL_SECONDS:-600}"
          BLOCKED_STATUS=blocked-target
          STORE_BLOCKED_STATUS=blocked-store
          REFRESHING_STATUS=refreshing
          # Host /run is mounted at /run, so files here are visible to the host's curl.
          WORK=/run/lxd-initializer
          mkdir -p "${WORK}"

          host() { nsenter -t 1 -m -p -- "$@"; }

          # Probe the snap binary on the HOST, not `command -v lxd`. This is the one check
          # that has to hold on both supported hosts:
          #   22.04 - nothing named lxd on PATH, so the old check installed correctly
          #   24.04 - ships the lxd-installer deb, whose stub at /usr/sbin/lxd made the
          #           old check succeed with no LXD actually installed
          snap_lxd_present() { nsenter -t 1 -m -p -- bash -lc 'test -x /snap/bin/lxd'; }

          # The init image has no curl, and apt-get in this pod has no proxy, so it fails
          # on proxy-only and air-gapped sites. Ubuntu hosts ship curl and the pod uses
          # the host network, so use the host's curl with the CA copied under ${WORK}.
          K8S_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          if command -v curl >/dev/null 2>&1; then
            K8S_CURL=(curl)
          elif host test -x /usr/bin/curl; then
            cp "${K8S_CA}" "${WORK}/ca.crt"
            K8S_CA="${WORK}/ca.crt"
            K8S_CURL=(host /usr/bin/curl)
          else
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq curl >/dev/null
            K8S_CURL=(curl)
          fi

          k8s_api_base() {
            local host port
            host="${KUBERNETES_SERVICE_HOST:?KUBERNETES_SERVICE_HOST not set}"
            port="${KUBERNETES_SERVICE_PORT_HTTPS:-${KUBERNETES_SERVICE_PORT:-443}}"
            K8S_CURL_RESOLVE="kubernetes.default.svc:${port}:${host}"
            echo "https://kubernetes.default.svc:${port}"
          }
          k8s_curl() {
            k8s_api_base >/dev/null
            "${K8S_CURL[@]}" -sS --cacert "${K8S_CA}" --resolve "${K8S_CURL_RESOLVE}" "$@"
          }
          version_ge() { printf '%s\n%s\n' "$2" "$1" | sort -C -V; }
          server_version() {
            host /snap/bin/lxc version 2>/dev/null | grep -E 'Server version:' | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -n1 || true
          }
          # Prints "<version> <revision>" that LXD_CHANNEL offers for this host's
          # architecture, e.g. "5.0.10 40911" from
          # "  5.0/stable:  5.0.10-24fe763 2026-09-25 (40911) 121MB -".
          # Store errors are often transient (every pod of the DaemonSet queries the
          # store at the same moment, usually through one proxy), so retry briefly
          # before falling back to the long wait, and log what snap reported.
          channel_candidate() {
            local out line attempt
            for attempt in 1 2 3 4; do
              out="$(host snap info lxd 2>&1)" || true
              line="$(awk -v ch="${LXD_CHANNEL}:" '
                $1 == ch { rev = $4; gsub(/[()]/, "", rev); split($2, v, "-"); print v[1], rev; exit }' <<< "${out}")"
              if [[ -n "${line}" ]]; then
                echo "${line}"
                return 0
              fi
              echo "snap info lxd gave no ${LXD_CHANNEL} entry (attempt ${attempt}/4): $(head -c 300 <<< "${out}" | tr '\n' ' ')" >&2
              (( attempt < 4 )) && sleep $(( attempt * 15 ))
            done
            return 1
          }
          # Prints the known revision of the pinned version for this architecture.
          known_revision() {
            local pair
            local -a pairs
            [[ -n "${LXD_TARGET_REVISIONS}" ]] || return 1
            IFS=',' read -ra pairs <<< "${LXD_TARGET_REVISIONS}"
            for pair in "${pairs[@]}"; do
              if [[ "${pair%%=*}" == "${ARCH}" && -n "${pair#*=}" ]]; then
                echo "${pair#*=}"
                return 0
              fi
            done
            return 1
          }
          installed_revision() {
            host snap list lxd 2>/dev/null | awk 'NR == 2 { print $3 }'
          }
          # Sets CAND_VERSION / CAND_REV to the version and revision this host refreshes
          # to. Otherwise it records upgrade-status=blocked-store or blocked-target, which
          # pauses this host but not others.
          resolve_target() {
            local cur="$1" line rev chan_version="" chan_rev=""
            CAND_VERSION=""
            CAND_REV=""
            rev="$(known_revision || true)"
            if [[ "${LXD_TARGET_VERSION}" != latest && -n "${rev}" ]]; then
              CAND_VERSION="${LXD_TARGET_VERSION}"
              CAND_REV="${rev}"
            else
              line="$(channel_candidate || true)"
              read -r chan_version chan_rev <<< "${line}" || true
              if [[ -z "${chan_version}" || -z "${chan_rev}" ]]; then
                mark_status "${STORE_BLOCKED_STATUS}" "cannot read ${LXD_CHANNEL} from the snap store"
                return 1
              fi
              if [[ "${LXD_TARGET_VERSION}" == latest ]]; then
                if version_ge "${chan_version}" "${LXD_RECOMMENDED_VERSION}"; then
                  CAND_VERSION="${chan_version}"
                  CAND_REV="${chan_rev}"
                elif [[ -n "${rev}" ]]; then
                  CAND_VERSION="${LXD_RECOMMENDED_VERSION}"
                  CAND_REV="${rev}"
                else
                  mark_status "${BLOCKED_STATUS}" "${LXD_CHANNEL} offers ${chan_version}, older than the recommended ${LXD_RECOMMENDED_VERSION}, which has no known revision for ${ARCH}"
                  return 1
                fi
              elif [[ "${chan_version}" == "${LXD_TARGET_VERSION}" ]]; then
                CAND_VERSION="${chan_version}"
                CAND_REV="${chan_rev}"
              else
                mark_status "${BLOCKED_STATUS}" "${LXD_TARGET_VERSION} has no known revision for ${ARCH} and ${LXD_CHANNEL} offers ${chan_version}"
                return 1
              fi
            fi
            if [[ -n "${cur}" ]] && version_ge "${cur}" "${CAND_VERSION}"; then
              mark_status "${BLOCKED_STATUS}" "target ${CAND_VERSION} is not newer than server ${cur}"
              return 1
            fi
            return 0
          }
          node_label() {
            local key="$1" token url
            token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            url="$(k8s_api_base)/api/v1/nodes/${NODE_NAME}"
            k8s_curl -H "Authorization: Bearer ${token}" "${url}" 2>/dev/null \
              | grep -oE "\"${key}\"[[:space:]]*:[[:space:]]*\"[^\"]*\"" | head -1 | cut -d'"' -f4 || true
          }
          patch_node() {
            local body="$1" token url
            token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            url="$(k8s_api_base)/api/v1/nodes/${NODE_NAME}"
            k8s_curl --fail -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/strategic-merge-patch+json" \
              -X PATCH "${url}" -d "${body}"
          }
          label_version() {
            patch_node "{\"metadata\":{\"labels\":{\"lxdhost.cluster.com/lxd-version\":\"$1\"}}}"
            echo "Labeled ${NODE_NAME} lxdhost.cluster.com/lxd-version=$1"
          }
          # Details can carry raw journal lines; unescaped quotes make the patch invalid.
          json_escape() {
            local s="${1:0:400}"
            s="${s//\\/\\\\}"
            s="${s//\"/\\\"}"
            tr -d '\000-\037' <<< "${s}"
          }
          status_patch() {
            echo "{\"metadata\":{\"labels\":{\"lxdhost.cluster.com/upgrade-status\":\"$1\"},\"annotations\":{\"lxdhost.cluster.com/upgrade-detail\":\"$(json_escape "$2")\"}}}"
          }
          mark_status() {
            local status="$1" detail="$2"
            patch_node "$(status_patch "${status}" "${detail}")" || true
            echo "Marked ${NODE_NAME} upgrade-status=${status} (${detail})"
          }
          # A failure has to be on the node before the lease is released. Otherwise other
          # hosts keep refreshing, and a restarted pod finds the new version and never
          # repeats the check that failed.
          mark_failed() {
            local status="$1" detail="$2" attempt=0
            until patch_node "$(status_patch "${status}" "${detail}")"; do
              attempt=$((attempt + 1))
              echo "Could not record upgrade-status=${status} on ${NODE_NAME} (attempt ${attempt}); retrying" >&2
              if (( attempt == 3 )); then
                echo "Recording a fixed detail instead of: ${detail}" >&2
                detail="see the ensure-lxd init container log on ${NODE_NAME}"
              fi
              sleep 10
            done
            echo "Marked ${NODE_NAME} upgrade-status=${status} (${detail})"
          }
          # Succeeds when a node reports upgrade-status=failed-* or an unverified
          # refreshing, and also when the node list cannot be read: the queue moves only
          # when it is known to be clear.
          refresh_queue_blocked() {
            local token nodes
            token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            if ! nodes="$(k8s_curl --fail -H "Authorization: Bearer ${token}" "$(k8s_api_base)/api/v1/nodes" 2>&1)"; then
              echo "Could not list nodes ($(head -c 200 <<< "${nodes}")); treating the refresh queue as paused" >&2
              return 0
            fi
            grep -qE '"lxdhost.cluster.com/upgrade-status"[[:space:]]*:[[:space:]]*"(failed|refreshing)' <<< "${nodes}"
          }
          configure_snap_proxy() {
            local conf http https
            conf="/etc/systemd/system/containerd.service.d/http-proxy.conf"
            if ! host test -f "${conf}"; then
              return 0
            fi
            http="$(host grep -oE 'HTTP_PROXY=[^" ]+' "${conf}" | head -1 | cut -d= -f2- || true)"
            https="$(host grep -oE 'HTTPS_PROXY=[^" ]+' "${conf}" | head -1 | cut -d= -f2- || true)"
            if [[ -n "${http}" ]]; then host snap set system proxy.http="${http}" || true; fi
            if [[ -n "${https}" ]]; then host snap set system proxy.https="${https}" || true; fi
            echo "snapd proxy set from containerd drop-in"
          }
          vm_in_transition() {
            local states
            states="$(host /snap/bin/lxc list --project maas -c s -f csv 2>/dev/null || host /snap/bin/lxc list -c s -f csv 2>/dev/null || true)"
            echo "${states}" | grep -Eiq 'starting|stopping|pending'
          }
          acquire_lock() {
            local token url base body holder code now_micro rv current renew duration now_epoch renew_epoch
            token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            base="$(k8s_api_base)"
            url="${base}/apis/coordination.k8s.io/v1/namespaces/${LOCK_NAMESPACE}/leases/${LOCK_NAME}"
            holder="${NODE_NAME}"
            now_micro="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
            body="{\"apiVersion\":\"coordination.k8s.io/v1\",\"kind\":\"Lease\",\"metadata\":{\"name\":\"${LOCK_NAME}\"},\"spec\":{\"holderIdentity\":\"${holder}\",\"leaseDurationSeconds\":${LOCK_TTL_SECONDS},\"acquireTime\":\"${now_micro}\",\"renewTime\":\"${now_micro}\"}}"
            code=$(k8s_curl -o ${WORK}/lease.json -w "%{http_code}" -H "Authorization: Bearer ${token}" "${url}" || true)
            if [[ "${code}" == "404" ]]; then
              code=$(k8s_curl -o ${WORK}/lease-create.json -w "%{http_code}" -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" -X POST "${base}/apis/coordination.k8s.io/v1/namespaces/${LOCK_NAMESPACE}/leases" -d "${body}" || true)
              [[ "${code}" == "201" || "${code}" == "200" ]] && return 0
              [[ "${code}" == "409" ]] && return 1
              echo "ERROR: lease create HTTP ${code}"
              return 1
            fi
            [[ "${code}" == "200" ]] || return 1
            current=$(grep -oE '"holderIdentity"[[:space:]]*:[[:space:]]*"[^"]*"' ${WORK}/lease.json | head -1 | cut -d'"' -f4 || true)
            renew=$(grep -oE '"renewTime"[[:space:]]*:[[:space:]]*"[^"]*"' ${WORK}/lease.json | head -1 | cut -d'"' -f4 || true)
            duration=$(grep -oE '"leaseDurationSeconds"[[:space:]]*:[[:space:]]*[0-9]+' ${WORK}/lease.json | head -1 | grep -oE '[0-9]+$' || echo "${LOCK_TTL_SECONDS}")
            rv=$(grep -oE '"resourceVersion"[[:space:]]*:[[:space:]]*"[^"]*"' ${WORK}/lease.json | head -1 | cut -d'"' -f4 || true)
            now_epoch=$(date -u +%s)
            renew_epoch=0
            if [[ -n "${renew}" ]]; then renew_epoch=$(date -u -d "${renew}" +%s 2>/dev/null || echo 0); fi
            stale=0
            if (( now_epoch - renew_epoch > duration )); then stale=1; fi
            if [[ "${current}" == "${holder}" || -z "${current}" || "${stale}" == "1" ]]; then
              now_micro="$(date -u +%Y-%m-%dT%H:%M:%S.%6NZ)"
              code=$(k8s_curl -o ${WORK}/lease-patch.json -w "%{http_code}" -H "Authorization: Bearer ${token}" -H "Content-Type: application/strategic-merge-patch+json" -X PATCH "${url}" -d "{\"metadata\":{\"resourceVersion\":\"${rv}\"},\"spec\":{\"holderIdentity\":\"${holder}\",\"leaseDurationSeconds\":${LOCK_TTL_SECONDS},\"renewTime\":\"${now_micro}\"}}" || true)
              [[ "${code}" == "200" ]] && return 0
              return 1
            fi
            echo "Lease held by ${current:-unknown}; waiting"
            return 1
          }
          # A refresh plus its readiness wait can outlast LOCK_TTL_SECONDS, and a stale
          # lease lets the next host start refreshing alongside this one.
          start_lease_renewal() {
            ( while sleep $(( LOCK_TTL_SECONDS / 4 )); do
                acquire_lock >/dev/null 2>&1 || echo "WARNING: could not renew lease ${LOCK_NAME}" >&2
              done ) &
            RENEW_PID=$!
          }
          release_lock() {
            local token url current rv
            if [[ -n "${RENEW_PID:-}" ]]; then
              kill "${RENEW_PID}" 2>/dev/null || true
              wait "${RENEW_PID}" 2>/dev/null || true
              RENEW_PID=""
            fi
            token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            url="$(k8s_api_base)/apis/coordination.k8s.io/v1/namespaces/${LOCK_NAMESPACE}/leases/${LOCK_NAME}"
            k8s_curl --fail -o ${WORK}/lease-release.json -H "Authorization: Bearer ${token}" "${url}" 2>/dev/null || return 0
            current=$(grep -oE '"holderIdentity"[[:space:]]*:[[:space:]]*"[^"]*"' ${WORK}/lease-release.json | head -1 | cut -d'"' -f4 || true)
            if [[ "${current}" != "${NODE_NAME}" ]]; then
              echo "Lease ${LOCK_NAME} is held by ${current:-nobody}; leaving it"
              return 0
            fi
            rv=$(grep -oE '"resourceVersion"[[:space:]]*:[[:space:]]*"[^"]*"' ${WORK}/lease-release.json | head -1 | cut -d'"' -f4 || true)
            k8s_curl -o /dev/null -H "Authorization: Bearer ${token}" -H "Content-Type: application/strategic-merge-patch+json" -X PATCH "${url}" -d "{\"metadata\":{\"resourceVersion\":\"${rv}\"},\"spec\":{\"holderIdentity\":\"\"}}" || true
          }

          qemu_pids() {
            host bash -lc "ps -eo pid,comm | grep '[q]emu' | awk '{print \$1}' | sort"
          }
          # Recorded before the refresh starts. snapd finishes a refresh even if this pod
          # is killed, so the replacement pod reads this and finishes the checks instead
          # of accepting the new version unverified.
          mark_refreshing() {
            local body="{\"metadata\":{\"labels\":{\"lxdhost.cluster.com/upgrade-status\":\"${REFRESHING_STATUS}\"},\"annotations\":{\"lxdhost.cluster.com/upgrade-detail\":\"refreshing to $1 revision $2\",\"lxdhost.cluster.com/refresh-target\":\"$1 $2\",\"lxdhost.cluster.com/refresh-since\":\"$3\"}}}"
            until patch_node "${body}"; do
              echo "Could not record upgrade-status=${REFRESHING_STATUS} on ${NODE_NAME}; retrying" >&2
              sleep 10
            done
          }
          wait_snap_changes_settled() {
            local waited=0
            while host snap changes 2>/dev/null | awk 'NR > 1 && $2 ~ /^(Do|Doing|Undo|Undoing|Wait)$/' | grep -q '"lxd"'; do
              if (( waited >= 900 )); then
                return 1
              fi
              sleep 15
              waited=$((waited + 15))
            done
          }
          # Checks a refresh to $1 (revision $2) that started at $3. Sets VERIFIED_VERSION
          # on success; records a failed-* status and returns 1 otherwise.
          verify_refresh() {
            local target_version="$1" target_rev="$2" since="$3" new new_rev stop
            # --revision leaves tracking alone; keep the host on the tested track.
            host snap switch --channel="${LXD_CHANNEL}" lxd || true
            host snap refresh --hold lxd || true
            if ! host /snap/bin/lxd waitready --timeout 300; then
              mark_failed "failed-not-ready" "LXD did not become ready after refresh"
              return 1
            fi
            new="$(server_version)"
            new_rev="$(installed_revision || true)"
            if [[ "${new}" != "${target_version}" || "${new_rev}" != "${target_rev}" ]]; then
              mark_failed "failed-version" "expected ${target_version} rev ${target_rev}, got ${new:-unknown} rev ${new_rev:-unknown}"
              return 1
            fi
            stop="$(host journalctl -u snap.lxd.daemon --since "${since}" --no-pager 2>/dev/null | grep -F 'Stop reason' | tail -1 || true)"
            echo "Daemon stop line: ${stop:-<none>}"
            if grep -qi 'host shutdown' <<< "${stop}"; then
              mark_failed "failed-host-shutdown" "refresh stopped instances on ${NODE_NAME}"
              return 1
            fi
            if [[ -z "${stop}" ]] || ! grep -qi 'snap refresh' <<< "${stop}"; then
              mark_failed "failed-stop-reason" "unexpected stop reason: ${stop:-absent}"
              return 1
            fi
            qemu_pids > "${WORK}/qemu-pids.post" || true
            if [[ -s "${WORK}/qemu-pids.pre" ]] && ! diff -q "${WORK}/qemu-pids.pre" "${WORK}/qemu-pids.post" >/dev/null; then
              mark_failed "failed-vm-restarted" "qemu PID set changed during refresh"
              return 1
            fi
            VERIFIED_VERSION="${new}"
          }

          install_if_missing() {
            if snap_lxd_present; then
              return 0
            fi
            echo "Snap LXD not present on host, installing snapd and LXD on host"
            host bash -lc 'command -v snap >/dev/null 2>&1 || { export DEBIAN_FRONTEND=noninteractive; apt-get update && apt-get install -y snapd; }'
            host systemctl enable --now snapd.socket
            configure_snap_proxy
            # A new host gets the same version a refresh would install, never an
            # unvalidated channel tip.
            until resolve_target ""; do
              echo "Cannot resolve the LXD version to install; retrying in 10 minutes"
              sleep 600
            done
            echo "Installing LXD ${CAND_VERSION} revision ${CAND_REV} (${ARCH})"
            host snap install lxd --revision="${CAND_REV}" || {
              echo "ERROR: Failed to install LXD revision ${CAND_REV}"
              exit 1
            }
            host snap switch --channel="${LXD_CHANNEL}" lxd || true
            host snap refresh --hold lxd || true
            if [[ "$(installed_revision || true)" != "${CAND_REV}" ]]; then
              echo "ERROR: expected LXD revision ${CAND_REV}, got $(installed_revision || echo none)"
              exit 1
            fi
            mark_status "ok" "installed LXD ${CAND_VERSION} revision ${CAND_REV}"
          }

          PREV="$(node_label lxdhost.cluster.com/upgrade-status || true)"
          if [[ "${PREV}" == failed* ]]; then
            echo "ERROR: ${NODE_NAME} has upgrade-status=${PREV}. Clear the label after investigation."
            exit 1
          fi
          if [[ "${PREV}" == "${REFRESHING_STATUS}" ]]; then
            read -r TARGET_VERSION TARGET_REV <<< "$(node_label lxdhost.cluster.com/refresh-target || true)" || true
            REFRESH_SINCE="$(node_label lxdhost.cluster.com/refresh-since || true)"
            echo "A refresh to ${TARGET_VERSION:-unknown} revision ${TARGET_REV:-unknown} on ${NODE_NAME} was interrupted; finishing its checks"
            if ! wait_snap_changes_settled; then
              mark_failed "failed-interrupted" "snapd change for lxd still running 15 minutes after an interrupted refresh"
              exit 1
            fi
            if [[ -n "${TARGET_REV}" && "$(installed_revision || true)" == "${TARGET_REV}" ]]; then
              if ! verify_refresh "${TARGET_VERSION}" "${TARGET_REV}" "${REFRESH_SINCE}"; then
                exit 1
              fi
              label_version "${VERIFIED_VERSION}"
              mark_status "ok" "interrupted refresh to ${VERIFIED_VERSION} verified"
              PREV=ok
            else
              echo "The interrupted refresh did not take effect; starting over"
              host snap refresh --hold lxd || true
              mark_status "pending" "interrupted refresh to ${TARGET_VERSION:-unknown} did not take effect"
              PREV=pending
            fi
          fi
          while [[ "$(node_label lxdhost.cluster.com/defer-refresh || true)" == "true" ]]; do
            echo "Host is being repaved; not refreshing LXD on ${NODE_NAME}"
            sleep 30
          done

          install_if_missing
          host snap refresh --hold lxd || true
          echo "Ensuring LXD daemon is running on host"
          host snap start --enable lxd.daemon || true
          echo "Waiting for LXD to become ready on host (timeout 5 min)…"
          if ! host /snap/bin/lxd waitready --timeout 300; then
            echo "LXD did not become ready after 5 minutes"; exit 1
          fi

          CUR="$(server_version)"
          echo "Current LXC Server version: ${CUR:-unknown}"
          if [[ "${AUTO_REFRESH}" != "true" ]]; then
            # The controller warns about hosts below 5.0.7 from this label.
            if [[ -n "${CUR}" ]]; then label_version "${CUR}"; fi
            echo "autoRefresh is off; leaving the installed snap unchanged"
            exit 0
          fi

          while vm_in_transition; do
            echo "A VM on ${NODE_NAME} is starting, stopping, or pending; waiting"
            sleep 30
          done

          if [[ -n "${CUR}" ]] && version_ge "${CUR}" "${REFRESH_BELOW}"; then
            label_version "${CUR}"
            if [[ "${PREV}" == blocked-* || "${PREV}" == queued || "${PREV}" == pending ]]; then
              mark_status "ok" "server ${CUR} is at or above ${REFRESH_BELOW}"
            fi
            exit 0
          fi

          # Only a refresh needs the store, so leave snapd's proxy alone otherwise.
          configure_snap_proxy
          # Wait here, outside the lease, until the target resolves. A new targetVersion
          # arrives as a DaemonSet change, which restarts this pod.
          until resolve_target "${CUR}"; do
            sleep 600
          done
          echo "Refresh target: ${CAND_VERSION} revision ${CAND_REV} (${ARCH})"
          mark_status "queued" "waiting for lease ${LOCK_NAME} to refresh to ${CAND_VERSION}"

          if ! host snap changes >/dev/null 2>&1; then
            echo "ERROR: snapd not responsive — refresh would be treated as host shutdown and stop every VM"
            exit 1
          fi
          FREE_KB="$(host df -Pk / | awk 'NR==2{print $4}')"
          if [[ "${FREE_KB}" -lt 512000 ]]; then
            echo "ERROR: insufficient free space for snap + core22 (${FREE_KB}KB)"; exit 1
          fi
          JMARK="lxd-initializer-jcheck-${NODE_NAME}-$(date -u +%s)"
          host systemd-cat -t lxd-initializer echo "${JMARK}" || true
          sleep 3
          # grep without -q reads the whole stream; -q exits early and pipefail then
          # reports the journalctl SIGPIPE as a missing marker.
          if ! host journalctl --no-pager --since "-2 min" 2>/dev/null | grep -F "${JMARK}" >/dev/null; then
            echo "ERROR: journal capture not working; refusing to refresh blind"; exit 1
          fi

          # The queue, the repave label and VM states can all change while this pod waits
          # for the lease, so check them again while holding it. If one blocks the refresh,
          # give the lease back and wait here: exiting 0 would finish the init container
          # and leave the host below its target.
          while true; do
            while refresh_queue_blocked; do
              echo "LXD refresh paused; a node has a failed or unverified LXD refresh"
              sleep 30
            done
            echo "Waiting for cluster lease ${LOCK_NAME}"
            LOCK_WAITED=0
            until acquire_lock; do
              sleep 15
              LOCK_WAITED=$((LOCK_WAITED + 15))
              if (( LOCK_WAITED > 3600 )); then
                echo "ERROR: could not acquire lease within 3600s"
                exit 1
              fi
            done
            start_lease_renewal
            trap release_lock EXIT

            WAIT_REASON=""
            if refresh_queue_blocked; then
              WAIT_REASON="a node has a failed or unverified LXD refresh"
            elif [[ "$(node_label lxdhost.cluster.com/defer-refresh || true)" == "true" ]]; then
              WAIT_REASON="host is being repaved"
            elif vm_in_transition; then
              WAIT_REASON="a VM is starting, stopping, or pending"
            fi
            if [[ -z "${WAIT_REASON}" ]]; then
              break
            fi
            echo "Not refreshing under the lease: ${WAIT_REASON}; releasing it and waiting"
            release_lock
            trap - EXIT
            sleep 30
          done

          CUR="$(server_version)"
          if [[ -n "${CUR}" ]] && version_ge "${CUR}" "${REFRESH_BELOW}"; then
            label_version "${CUR}"
            mark_status "ok" "server ${CUR} is at or above ${REFRESH_BELOW}"
            exit 0
          fi
          TARGET_VERSION="${CAND_VERSION}"
          TARGET_REV="${CAND_REV}"
          if ! resolve_target "${CUR}" || [[ "${CAND_REV}" != "${TARGET_REV}" ]]; then
            echo "The refresh target changed while waiting for the lease; retrying from the start"
            exit 1
          fi

          qemu_pids > "${WORK}/qemu-pids.pre" || true
          REFRESH_SINCE="$(host date -u '+%Y-%m-%d %H:%M:%S UTC')"
          mark_refreshing "${TARGET_VERSION}" "${TARGET_REV}" "${REFRESH_SINCE}"
          echo "Refreshing LXD to ${TARGET_VERSION} revision ${TARGET_REV} (server ${CUR:-unknown} is below ${REFRESH_BELOW})"
          host snap refresh --unhold lxd || true
          if ! host snap refresh lxd --revision="${TARGET_REV}"; then
            host snap refresh --hold lxd || true
            mark_failed "failed-refresh" "snap refresh to revision ${TARGET_REV} failed on ${NODE_NAME}"
            exit 1
          fi
          if ! verify_refresh "${TARGET_VERSION}" "${TARGET_REV}" "${REFRESH_SINCE}"; then
            exit 1
          fi
          label_version "${VERIFIED_VERSION}"
          mark_status "ok" "${CUR:-unknown} -> ${VERIFIED_VERSION}"
          echo "LXD refresh complete on ${NODE_NAME}: ${CUR:-?} -> ${VERIFIED_VERSION}"
        securityContext:
          privileged: true
        volumeMounts:
        - name: var-lib-snapd
          mountPath: /var/lib/snapd
        - name: snap
          mountPath: /snap
        - name: run
          mountPath: /run
        - name: var-snap-lxd
          mountPath: /var/snap/lxd
          mountPropagation: HostToContainer
        - name: var-snap-common-lxd
          mountPath: /var/snap/lxd/common/lxd
          mountPropagation: HostToContainer
      containers:
      - name: lxd-initializer
        image: ${LXD_INITIALIZER_IMAGE}  # Will be replaced by envsubst during build
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: STORAGE_BACKEND
          value: "${STORAGE_BACKEND}"
        - name: NIC_TYPE
          value: "${NIC_TYPE}"
        - name: NIC_PARENT
          value: "${NIC_PARENT}"
        - name: STORAGE_SIZE
          value: "${STORAGE_SIZE}"                   
        - name: NETWORK_BRIDGE
          value: "${NETWORK_BRIDGE}"
        - name: SKIP_NETWORK_UPDATE
          value: "${SKIP_NETWORK_UPDATE}"
        - name: TRUST_PASSWORD
          value: "${TRUST_PASSWORD}"
        volumeMounts:
        - name: var-lib-lxd
          mountPath: /var/lib/lxd
        - name: var-snap-lxd
          mountPath: /var/snap/lxd
          mountPropagation: HostToContainer
        - name: var-snap-common-lxd
          mountPath: /var/snap/lxd/common/lxd
          mountPropagation: HostToContainer
        - name: run
          mountPath: /run
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: var-lib-lxd
        hostPath:
          path: /var/lib/lxd
      - name: var-snap-lxd
        hostPath:
          path: /var/snap/lxd
      - name: var-snap-common-lxd
        hostPath:
          path: /var/snap/lxd/common/lxd
      - name: var-lib-snapd
        hostPath:
          path: /var/lib/snapd
      - name: snap
        hostPath:
          path: /snap
      - name: run
        hostPath:
          path: /run
      - name: tmp
        hostPath:
          path: /tmp
      serviceAccount: lxd-initializer
      serviceAccountName: lxd-initializer
      restartPolicy: Always
