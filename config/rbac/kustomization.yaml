- leader_election_role.yaml
- leader_election_role_binding.yaml
# Despite the auth_proxy_ file names, these are NOT the kube-rbac-proxy sidecar's
# resources — that sidecar is gone. proxy-role and proxy-rolebinding are load-bearing:
# they let the manager itself create TokenReviews and SubjectAccessReviews, which is how
# the diagnostics endpoint authorises every /metrics and /debug/pprof request. Removing
# them makes the endpoint reject all traffic. metrics-reader is the ClusterRole a scraper
# binds to. Renaming these files is a worthwhile follow-up; it is kept out of this change
# to hold the backport diff down.
- auth_proxy_service.yaml
- auth_proxy_role.yaml
- auth_proxy_role_binding.yaml
- auth_proxy_client_clusterrole.yaml
