PROVIDER=capmaas
# Upstream baseline = Spectro's own `main` (plain vX.Y.Z-spectro train); our work rides
# `spectro-master` (-fork-spectro-4.10.x train) and is cherry-picked onto it. No third-party
# upstream (canonical/... not a reachable remote; spectrocloud-public/... is not a fork) and no
# kubernetes-sigs remote -> capi-fleet keeps MAAS on the maintainer variant (no reconcile plan,
# no Gate 1).
SPECTRO_SRC=origin/spectro-master
UPSTREAM_URL=https://github.com/spectrocloud-public/cluster-api-provider-maas.git
MAINTAINER=1
# --- integration/validation tail (Spec Patch) ---
CLOUD=maas
CBT_FEATURE=lifecycle   # ally/tests/cbt go-test suite (NOT make cbt-<cloud>); select per cloud
VENDORCRD=config/vendorcrd/maas
BUILD_VARS_ENABLED=1
BUILD_VARS_MAKEFILE=Makefile
BUILD_VARS_TAG_KEY=TAG
BUILD_VARS_GO_KEY=BUILDER_GOLANG_VERSION
