name: Backport

on:
  pull_request_target:
    types: ["labeled", "closed"]

# The backport action pushes a branch and opens a pull request, removes the
# auto-backport label and comments on conflicts. Grant only what those need.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  backport:
    name: Backport PR
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'auto-backport')
      && (
        (github.event.action == 'labeled' && github.event.label.name == 'auto-backport')
        || (github.event.action == 'closed')
      )
    steps:
      - name: Backport Action
        # v12 runs on Node 24 and renames add_original_reviewers to
        # copy_source_pr_reviewers. v9 targets the deprecated Node 20 runtime.
        uses: sorenlouv/backport-github-action@v12.0.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          auto_backport_label_prefix: backport-
          copy_source_pr_reviewers: true

      - name: Info log
        if: ${{ success() }}
        run: cat ~/.backport/backport.info.log

      - name: Debug log
        if: ${{ failure() }}
        run: cat ~/.backport/backport.debug.log
